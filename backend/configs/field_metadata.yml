# Field-level Tier / source / unit map for the authority-aware data model.
# Tier describes evidence strength; `is_mock` separately discloses synthetic
# demo values. UI reads this file for provenance labels and validators use it
# to check units.
#
# tier: 1 = Observed | 2 = Derived | 3a = Operational estimate |
#       3b = Counterfactual estimate | 4 = Unknown | null = metadata
# source: named pipeline or source; unit: string

version: "1.0.0"

dataset_context:
  is_synthetic_demo: true
  note: >
    This checkout contains synthetic township data. Tier records the intended
    evidence class and authority scope; it does not turn mock values into
    observed SDP records.

tiers:
  1: { name: observed, definition: "Direct record or observation" }
  2: { name: derived, definition: "Computed from Tier 1 inputs" }
  3a: { name: operational_estimate, definition: "Proxy for operational judgement" }
  3b: { name: counterfactual_estimate, definition: "Simulation only; excluded from deadspace flags" }
  4: { name: unknown, definition: "No defensible source" }

authority_rules:
  full_control: "Operating performance may use available operational metrics."
  sold: "Developer realization plus community value; operational values are proxies."
  shared: "Full-control scope only for fields actually shared by the JMB; otherwise proxies."
  public_transferred: "Community and environmental value; operational values are proxies or unknown."

assets:
  asset_id:                 { tier: 1, source: asset_register, unit: id }
  asset_type:               { tier: 1, source: asset_register, unit: enum }
  parcel_id:                { tier: 1, source: cadastral_record, unit: id }
  building_id:              { tier: 1, source: building_register, unit: id }
  asset_name:               { tier: 1, source: asset_register, unit: null }
  land_use:                 { tier: 1, source: planning_record, unit: enum }
  development_phase:        { tier: 1, source: planning_record, unit: count }
  status:                   { tier: 1, source: asset_register, unit: enum }
  completion_year:          { tier: 1, source: asset_register, unit: year }
  target_demographic:       { tier: 1, source: planning_record, unit: enum }
  floor_area_m2:            { tier: 1, source: asset_register, unit: m2 }
  lettable_area_m2:         { tier: 1, source: asset_register, unit: m2 }
  land_area_m2:             { tier: 1, source: cadastral_record, unit: m2 }
  capex_initial_rm:         { tier: 1, source: capital_record, unit: RM }
  opex_annual_rm:           { tier: 1, source: operating_cost_record, unit: RM,
                              authority_tiers: { sold: 3a, shared: 3a, public_transferred: 3a } }
  maintenance_annual_rm:    { tier: 1, source: maintenance_record, unit: RM,
                              authority_tiers: { sold: 3a, shared: 3a, public_transferred: 3a } }
  capacity:                 { tier: 1, source: asset_register, unit: count }
  data_completeness:        { tier: 2, source: derived_data_quality, unit: ratio }
  data_sources:             { tier: null, source: identity, unit: null }
  subtype:                  { tier: 1, source: asset_register, unit: enum }
  ownership_status:         { tier: 1, source: asset_register, unit: enum }
  authority:                { tier: 1, source: ownership_mapping, unit: enum }
  unit_count:               { tier: 1, source: asset_register, unit: count }
  developer_held_units:     { tier: 1, source: inventory_register, unit: count }
  unit_mix_json:            { tier: 1, source: asset_register, unit: json }
  sale_price_rm:            { tier: 1, source: synthetic_transaction_mock, unit: RM,
                              authority_scope: sold, is_mock: true }
  sale_date:                { tier: 1, source: synthetic_transaction_mock, unit: date,
                              authority_scope: sold, is_mock: true }
  sale_data_source:         { tier: null, source: provenance, unit: enum }
  data_confidence:          { tier: null, source: authority_mapping, unit: enum,
                              enum: [high, medium, low] }

asset_metrics:
  year:                             { tier: null, source: identity, unit: year }

  # Identity and observed
  subtype:                          { tier: null, source: identity, unit: null }
  occupancy_rate:                   { tier: 1, source: internal_occupancy_record, unit: ratio,
                                      authority_scope: full_control, is_mock: true }
  vacancy_rate:                     { tier: 2, source: derived_from_occupancy, unit: ratio,
                                      authority_scope: full_control, is_mock: true }
  vacancy_duration_months:          { tier: 1, source: internal_occupancy_record, unit: month,
                                      authority_scope: full_control, is_mock: true }
  footfall_daily:                   { tier: 1, source: internal_footfall_record, unit: person/day,
                                      authority_scope: full_control, is_mock: true }
  utilisation_rate:                 { tier: 1, source: internal_utilisation_record, unit: ratio,
                                      authority_scope: full_control, is_mock: true }
  rental_income_rm:                 { tier: 1, source: internal_lease_record, unit: RM,
                                      authority_scope: full_control, is_mock: true,
                                      authority_tiers: { sold: 3a, shared: 3a } }
  energy_kwh:                       { tier: 1, source: internal_meter, unit: kWh,
                                      authority_scope: full_control, is_mock: true,
                                      authority_tiers: { sold: 3a, shared: 3a, public_transferred: 3a } }

  # Derived financial
  noi_rm:                           { tier: 2, source: derived, unit: RM,
                                      authority_tiers: { sold: 3b, shared: 3b, public_transferred: 3b } }
  noi_yield:                        { tier: 2, source: derived, unit: ratio,
                                      authority_tiers: { sold: 3b, shared: 3b, public_transferred: 3b } }
  maintenance_surge_rm:             { tier: 2, source: derived, unit: RM }
  rental_income_per_visit_proxy:    { tier: 2, source: derived, unit: "RM/person/day" }

  # Deprecated bridge — kept during Phase 4 transition
  accessibility_score:              { tier: 2, source: derived, unit: 0-100, deprecated: true }

  # Walking profile
  catchment_population_5min_walk:   { tier: 2, source: derived, unit: count }
  catchment_population_10min_walk:  { tier: 2, source: derived, unit: count }
  catchment_population_15min_walk:  { tier: 2, source: derived, unit: count }
  coverage_ratio_5min_walk:         { tier: 2, source: derived, unit: ratio }
  coverage_ratio_10min_walk:        { tier: 2, source: derived, unit: ratio }
  coverage_ratio_15min_walk:        { tier: 2, source: derived, unit: ratio }
  mean_walk_distance_m:             { tier: 2, source: derived, unit: m }
  median_walk_distance_m:           { tier: 2, source: derived, unit: m }
  p90_walk_distance_m:              { tier: 2, source: derived, unit: m }
  reachable_population_walk:        { tier: 2, source: derived, unit: count }
  total_catchment_population:       { tier: 2, source: derived, unit: count }

  # Driving profile
  catchment_population_5min_drive:  { tier: 2, source: derived, unit: count }
  catchment_population_10min_drive: { tier: 2, source: derived, unit: count }
  catchment_population_15min_drive: { tier: 2, source: derived, unit: count }
  coverage_ratio_5min_drive:        { tier: 2, source: derived, unit: ratio }
  coverage_ratio_10min_drive:       { tier: 2, source: derived, unit: ratio }
  coverage_ratio_15min_drive:       { tier: 2, source: derived, unit: ratio }
  mean_drive_distance_m:            { tier: 2, source: derived, unit: m }
  median_drive_distance_m:          { tier: 2, source: derived, unit: m }
  p90_drive_distance_m:             { tier: 2, source: derived, unit: m }
  reachable_population_drive:       { tier: 2, source: derived, unit: count }

  # Demand
  effective_demand:                 { tier: 3b, source: huff_assumption, unit: count }
  effective_demand_m2:              { tier: 2, source: derived, unit: m2 }
  effective_supply:                 { tier: 3b, source: supply_assumption, unit: count }
  dsr:                              { tier: 2, source: derived, unit: ratio }

  # Environment
  t_asset_c:                        { tier: 1, source: observed, unit: degC }
  t_township_c:                     { tier: 1, source: observed, unit: degC }
  surface_temp_delta_c:             { tier: 1, source: observed, unit: degC }
  surface_temp_provenance:          { tier: null, source: observed, unit: null }
  surface_temp_collection_id:       { tier: null, source: observed, unit: null }
  surface_temp_band:                { tier: null, source: observed, unit: null }
  surface_temp_source_catalog:      { tier: null, source: observed, unit: null }
  surface_temp_valid_pixel_count:   { tier: null, source: observed, unit: pixel }
  surface_temp_period_start:        { tier: null, source: observed, unit: date }
  surface_temp_period_end:          { tier: null, source: observed, unit: date }
  surface_temp_source_image_count:  { tier: null, source: observed, unit: count }
  carbon_operational_tco2e:         { tier: 2, source: derived, unit: tCO2e }
  embodied_carbon_total_tco2e:
    tier: 2
    source: derived
    unit: tCO2e
    is_synthetic: true
    calibration_note: >
      Derived from taxonomy.yml material_intensity_tco2e_m2 × floor area.
      NOT computed from a building-level BOM. Every building of the
      same subtype receives the same intensity, so per-building
      life-cycle ranking is invalid. Use only for township-scale
      order-of-magnitude comparison.
  sequestration_by_year_tco2e_year:
    tier: 2
    source: derived
    unit: tCO2e/yr
  sequestration_cumulative_tco2e:
    tier: 2
    source: derived
    unit: tCO2e
  net_carbon_by_year_tco2e_year:
    tier: 2
    source: derived
    unit: tCO2e/yr

  # Green
  green_coverage:                   { tier: 2, source: derived, unit: ratio }
  canopy_coverage:                  { tier: 2, source: derived, unit: ratio }
  shade_proxy_score:                { tier: 2, source: derived, unit: 0-100 }
  green_per_capita_m2:              { tier: 2, source: derived, unit: m2/person }

  # Facility
  service_coverage:                 { tier: 2, source: derived, unit: ratio }
  cost_per_user_rm:                 { tier: 2, source: derived, unit: RM }

  # Parcel
  developable_area_m2:              { tier: 2, source: derived, unit: m2 }
  potential_gfa_m2:                 { tier: 2, source: derived, unit: m2 }
  demand_supply_gap:                { tier: 2, source: derived, unit: m2 }
  infrastructure_cost_rm:           { tier: 2, source: derived, unit: RM }

  # Residential
  energy_intensity_kwh_m2:          { tier: 2, source: derived, unit: "kWh/m2/year" }

  # Diagnostic indicators (Phase 2)
  demographic_mismatch:             { tier: 2, source: derived, unit: ratio }
  neighborhood_diversity:           { tier: 2, source: derived, unit: ratio }

asset_leases:
  lease_id:                { tier: null, source: identity, unit: id }
  asset_id:                { tier: 1, source: asset_register, unit: id }
  unit_index:              { tier: 1, source: unit_mix, unit: count }
  subtype:                 { tier: 1, source: asset_register, unit: enum }
  floor_area_m2:           { tier: 1, source: asset_register, unit: m2 }
  lease_start_year:        { tier: 1, source: private_lease_schedule, unit: year,
                             authority_tiers: { sold: 4, shared: 4, public_transferred: 4 } }
  lease_end_year:          { tier: 1, source: private_lease_schedule, unit: year,
                             authority_tiers: { sold: 4, shared: 4, public_transferred: 4 } }
  rental_income_rm_annual: { tier: 1, source: private_lease_schedule, unit: RM/year,
                             authority_tiers: { sold: 4, shared: 4, public_transferred: 4 } }
  lease_status:            { tier: 1, source: private_lease_schedule, unit: enum,
                             authority_tiers: { sold: 4, shared: 4, public_transferred: 4 } }
  tenant_type:             { tier: 1, source: private_lease_schedule, unit: enum,
                             authority_tiers: { sold: 4, shared: 4, public_transferred: 4 } }

population:
  population_id:      { tier: null, source: identity, unit: null }
  asset_id:           { tier: null, source: identity, unit: null }
  total_population:   { tier: 1, source: observed, unit: count }
  age_0_14:           { tier: 1, source: observed, unit: count }
  age_15_64:          { tier: 1, source: observed, unit: count }
  age_65_plus:        { tier: 1, source: observed, unit: count }
  median_income_rm:   { tier: 1, source: observed, unit: RM }
  household_size:     { tier: 1, source: observed, unit: person }
  source:             { tier: null, source: identity, unit: null }

external_data:
  # Google Places API (New) structure-faithful mock.
  google_place_id:             { tier: 3a, source: google_places_mock,
                                 schema_ref: "Place Details (New): id",
                                 is_mock: true, live_swap_ready: true }
  business_status:             { tier: 3a, source: google_places_mock,
                                 schema_ref: "Place Details (New): businessStatus",
                                 enum: [OPERATIONAL, CLOSED_TEMPORARILY, CLOSED_PERMANENTLY, FUTURE_OPENING],
                                 is_mock: true, live_swap_ready: true }
  business_presence_ratio:     { tier: 3a, source: derived_from_google_places_mock,
                                 unit: ratio, is_mock: true, live_swap_ready: true }
  business_subtype_counts_json: { tier: 3a, source: google_places_type_mapping,
                                 unit: json, is_mock: true, live_swap_ready: true }
  business_vitality_score:     { tier: 3a, source: derived_from_google_places_mock,
                                 formula: "minmax(rating * log1p(user_rating_count))",
                                 unit: ratio, is_mock: true, live_swap_ready: true }
  proxied_vacancy_duration:    { tier: 3a, source: derived_from_google_places_mock,
                                 unit: month, note: "Requires at least 2 quarterly snapshots",
                                 is_mock: true, live_swap_ready: true }
  business_turnover_count:     { tier: 3a, source: derived_from_google_places_mock,
                                 unit: count, is_mock: true, live_swap_ready: true }

  # Kido Dynamics / LBS structure-faithful mock.
  lbs_unique_users_daily:      { tier: 3a, source: kido_dynamics_mock,
                                 schema_ref: "POI analytics: unique_users", unit: person/day,
                                 is_mock: true, live_swap_ready: true }
  grid_unique_users_daily:     { tier: 3a, source: kido_dynamics_mock,
                                 schema_ref: "400m grid: unique_users", unit: person/day,
                                 is_mock: true, live_swap_ready: true }
  lbs_dwell_time_minutes:      { tier: 3a, source: kido_dynamics_mock,
                                 schema_ref: "POI analytics: dwell_time", unit: minute,
                                 is_mock: true, live_swap_ready: true }
  lbs_visit_frequency_monthly: { tier: 3a, source: derived_from_kido_mock,
                                 schema_ref: "Monthly visits per unique user", unit: visit/person/month,
                                 is_mock: true, live_swap_ready: true }
  lbs_hourly_splits:           { tier: 3a, source: derived_from_kido_mock,
                                 schema_ref: "24-element normalized array, hours 0-23",
                                 is_mock: true, live_swap_ready: true }
  lbs_visitor_demographics:    { tier: 3a, source: derived_from_kido_mock,
                                 schema_ref: "{age_bands, socioeconomic_class}",
                                 is_mock: true, live_swap_ready: true }
  proxied_occupancy_lbs:       { tier: 3a, source: derived_from_kido_mock,
                                 formula: "unique_users * avg_dwell / 60 / operating_hours / capacity_users",
                                 unit: ratio, is_mock: true, live_swap_ready: true }
  proxied_occupancy_google:    { tier: 3a, source: derived_from_google_places_mock,
                                 formula: "min(1, business_presence_ratio * 1.15)",
                                 unit: ratio, is_mock: true, live_swap_ready: true }
  traffic_exposure_vpd:        { tier: 3a, source: kido_dynamics_mock,
                                 schema_ref: "Traffic: vehicle_count_by_hour summed",
                                 unit: vehicles/day, is_mock: true, live_swap_ready: true }
  traffic_exposure_source:     { tier: null, source: provenance,
                                 enum: [kido_mock, osm_proxy] }

  # Derived activity and population signals.
  flow_island_ratio:           { tier: 3a, source: derived_from_kido_mock,
                                 formula: "reachable_neighbor_users / (local_users + reachable_neighbor_users)",
                                 unit: ratio, note: "Below 0.3 indicates network isolation",
                                 is_mock: true, live_swap_ready: true }
  observed_demand_ratio:       { tier: 3a, source: derived_from_kido_mock,
                                 formula: "lbs_unique_users_daily / capacity_users",
                                 unit: ratio, note: "Cross-check for Huff-derived DSR",
                                 is_mock: true, live_swap_ready: true }
  worldpop_raw_pop:            { tier: 3a, source: worldpop_global2, unit: person,
                                 dataset: "MYS 2026 constrained 100m R2025A v1" }
  worldpop_effective_pop:      { tier: 3a, source: derived_from_worldpop,
                                 formula: "min(worldpop_raw_pop, residential_unit_capacity)",
                                 unit: person }
  residential_population:      { tier: 3a, source: worldpop_zonal_sum,
                                 authority_tiers: { full_control: 2, public_transferred: 4 },
                                 unit: person }

unknown_fields:
  lease_schedule: { tier: 4, source: unavailable_private_lease_terms, unit: date_range }

# Fields served by GET /api/assets/profiles that are not raw columns of the
# tables above: values the profile builder renames, derives at build time, or
# serves per subunit. Read only by backend/scripts/build_profiles.py, which
# resolves every served metric's tier and source against this file.
# Kept out of `asset_metrics` on purpose: generate_mock_data.py uses that
# section's keys as its CSV column list.
profile_fields:
  proxied_occupancy:            { tier: 3a, source: lbs_then_google_places, unit: ratio,
                                  note: "LBS proxied_occupancy_lbs first, Google Places fallback (B6 layer3a)",
                                  is_mock: true }
  operational_place_count:      { tier: 3a, source: google_places_mock, unit: count, is_mock: true }
  unit_mix_unit_count:          { tier: 1, source: asset_register, unit: count }
  occupied_units:               { tier: 1, source: inventory_register, unit: count,
                                  authority_scope: full_control, is_mock: true }

  # Energy end-use split follows the total's authority rule.
  energy_kwh_hvac:              { tier: 2, source: end_use_split_model, unit: kWh,
                                  authority_tiers: { sold: 3a, shared: 3a, public_transferred: 3a } }
  energy_kwh_lighting_equipment: { tier: 2, source: end_use_split_model, unit: kWh,
                                  authority_tiers: { sold: 3a, shared: 3a, public_transferred: 3a } }
  energy_kwh_base_load:         { tier: 2, source: end_use_split_model, unit: kWh,
                                  authority_tiers: { sold: 3a, shared: 3a, public_transferred: 3a } }

  # Occupancy-dependent carbon: derived from observed occupancy when owned,
  # from proxy occupancy otherwise (only populated for simulated years).
  carbon_productive_tco2e:      { tier: 2, source: derived_from_occupancy, unit: tCO2e,
                                  authority_tiers: { sold: 3a, shared: 3a, public_transferred: 3a } }
  carbon_stranded_tco2e:        { tier: 2, source: derived_from_occupancy, unit: tCO2e,
                                  authority_tiers: { sold: 3a, shared: 3a, public_transferred: 3a } }
  stranded_carbon_ratio:        { tier: 2, source: derived_from_occupancy, unit: ratio,
                                  authority_tiers: { sold: 3a, shared: 3a, public_transferred: 3a } }

  apparent_temp_c:              { tier: 2, source: derived_from_landsat_lst, unit: degC,
                                  formula: "LST -> 1.5 m air temp (LCZ damping) -> Steadman apparent temp" }

  # Trajectory needs an occupancy history, which only owned assets have.
  trajectory_class:             { tier: 2, source: derived_from_occupancy_history, unit: enum,
                                  authority_tiers: { sold: 4, shared: 4, public_transferred: 4 } }
  peak_occupancy:               { tier: 2, source: derived_from_occupancy_history, unit: ratio }
  years_since_peak:             { tier: 2, source: derived_from_occupancy_history, unit: year }
  occupancy_trend_3yr:          { tier: 2, source: derived_from_occupancy_history, unit: ratio }
  vacancy_streak_months:        { tier: 2, source: derived_from_occupancy_history, unit: month }

  # Survival OPEX floor (B6 layer3_survival), sold commercial only.
  estimated_revenue_rm:         { tier: 3a, source: survival_floor_model, unit: RM,
                                  formula: "lbs_users_daily x conversion x avg_spend x operating_days",
                                  is_mock: true }
  survival_opex_floor_rm:       { tier: 3a, source: survival_floor_model, unit: RM,
                                  formula: "lettable_area_m2 x survival_opex_per_m2 x inflation_index" }
  hemorrhage_ratio:             { tier: 3a, source: survival_floor_model, unit: ratio,
                                  formula: "estimated_revenue_rm / survival_opex_floor_rm", is_mock: true }

  # Developer realisation, sold assets only.
  sale_profit_rm:               { tier: 2, source: derived_from_sale_price, unit: RM,
                                  formula: "sale_price_rm - capex_initial_rm", is_mock: true }
  sale_return_ratio:            { tier: 2, source: derived_from_sale_price, unit: ratio,
                                  formula: "(sale_price_rm - capex_initial_rm) / capex_initial_rm", is_mock: true }

  # Per-subunit fields (profile.subunits[]).
  subunit_area_m2:              { tier: 1, source: asset_register_unit_mix, unit: m2 }
  subunit_design_count:         { tier: 1, source: asset_register_unit_mix, unit: count }
  subunit_occupancy:            { tier: 1, source: internal_occupancy_record, unit: ratio,
                                  authority_scope: full_control, is_mock: true }
  subunit_operational_count:    { tier: 3a, source: google_places_mock, unit: count, is_mock: true }
  subunit_presence_ratio:       { tier: 3a, source: google_places_mock, unit: ratio, is_mock: true }
  subunit_vitality_score:       { tier: 3a, source: google_places_mock, unit: ratio, is_mock: true }
  subunit_allocated_carbon_tco2e: { tier: 2, source: derived_area_share, unit: tCO2e }
  subunit_allocated_noi_rm:     { tier: 2, source: derived_area_share, unit: RM }

