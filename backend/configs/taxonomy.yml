# Business taxonomy for Living Masterplan.
#
# Purpose: provide subtype-level benchmarks so that derived metrics, Huff
# competition, carbon estimation, and 15-min coverage can be computed per
# business category, not just per asset class.
#
# Energy intensity values are annual kWh per m² of GFA.
# Carbon is NOT stored here; it is derived from energy intensity and the
# grid emission factor defined in assumptions.yml.
#
# Sources: Malaysia Energy Commission (Suruhanjaya Tenaga) building energy
# benchmarks 2023; BCA Green Mark regional reference; JLL/CBRE retail
# reports; MOH clinic planning standards. Values marked "placeholder" are
# unverified and should be replaced when project-level data is available.

version: "0.4.0"

# ---------------------------------------------------------------
# Subtypes
# ---------------------------------------------------------------

subtypes:

# ============ Commercial ============
  convenience_retail:
    asset_class: commercial
    display_name: "Convenience retail"
    target_area_m2: [50, 300]
    occupancy_benchmark: 0.85
    energy_intensity_kwh_m2_year: 280          # Malaysia retail (ST audit range)
    material_intensity_tco2e_m2: 0.35          # light steel + masonry
    structural_lifespan_years: 30
    target_demographics: [all]
    competition_radius_m: 500
    demand_coefficient_m2_per_person: 0.05
    is_core_amenity: true
    source: "Malaysia retail property report 2024"

  supermarket:
    asset_class: commercial
