# MCDA weights per asset type. Must sum to 1.0.
# B5 reads this file. Objective presets used by C to re-weight.

version: "0.2.0"

commercial:
  financial:      0.35
  occupancy:      0.25
  demand:         0.20
  accessibility:  0.10
  environment:    0.10

community_facility:
  utilisation:     0.25
  coverage:        0.25
  accessibility:   0.20
  cost_efficiency: 0.15
  environment:     0.15

green_space:
  green_coverage:  0.25
  canopy:          0.20
  accessibility:   0.20
  thermal:         0.20
  usage:           0.15

undeveloped_parcel:
  development_feasibility: 0.30
  demand:                  0.25
  accessibility:           0.20
  environment:             0.15
  risk:                    0.10

residential:
  financial:      0.35
  occupancy:      0.25
  demand:         0.20
  accessibility:  0.10
  environment:    0.10

# Objective presets. Used by C when user changes priority.
objectives:
  balanced:
    financial:     0.34
    environmental: 0.33
    social:        0.33
  financial:
    financial:     0.70
    environmental: 0.15
    social:        0.15
  environmental:
    financial:     0.15
    environmental: 0.70
    social:        0.15
  social:
    financial:     0.15
    environmental: 0.15
    social:        0.70

# v0.3.0 additions

scoring_options:
  hard_gate_threshold: 20             # NEW — if any component < 20, cap overall
  hard_gate_multiplier: 1.5           # NEW — overall <= multiplier * min(component)
  use_geometric_mean: false           # NEW — if true, use Cobb-Douglas instead of WLC